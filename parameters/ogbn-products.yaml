dataset:
  # Name of the dataset
  name: ogbn-products
  # Paths for saving models and datasets
  path: data/ogbn-products
  # enable secure aggregation initialization (SAI) component
  sai: true
  # Swap message passing order in GCN
  position_swap: true
  ####################### dataset properties #######################
  properties:
  # Number of classes for the dataset
    num_classes: 47
    # Number of features for each node
    num_features: 100
    # Number of nodes in the graph
    num_nodes: 2449029
    # Number of edges in the graph, not used in the current version
    num_edges: 61859140
    # Number of training nodes
    num_train: 196615
    # Number of validation nodes, num_val = num_val + num_train
    num_val: 235938
    # Number of test nodes
    num_test: 2213091
    # Maximum degree of the graph
    max_degree: 17481
  ####################### network configuration #######################
  network:
    # Run (network) number of the pre-trained network
    no_of_runs: 4
    # Number of hidden layers
    hidden_layer_size: 256
    # Pre-trained model paths
    preload_network_path: data/ogbn-products/network
    # Whether to enable large network mode
    large_network: false
    # Whether to enable normalization, only works in training phase
    with_normalization: false
  ####################### Graph configuration #######################
  graph:
    # Whether to enable neighbor masking, which when enabled protects graph structure privacy.
    mask_neighbor: true
    # neighbor padding mode: bucket | random | secgnn | none
    neighbor_padding_mode: bucket
    # bucket configuration
    bucket:
      # strategy: exponential | equal | custom
      strategy: exponential
      # merge mode: full_bucket | partial_fill
      merge_mode: full_bucket
      # minimum nodes per bucket for k-anonymity style protection
      min_nodes_k: 32
      # used when strategy is equal
      count: 8
      # used when strategy is exponential
      exp_base: 2
      # used when strategy is custom, e.g. [8, 16, 32, 64, 128, 168]
      boundaries: []
    # Whether to export per-node mask distribution
    export_mask_distribution: false
    # Output directory for per-node mask distribution CSV
    mask_distribution_output_dir: output/mask_distribution
    # Whether to save node initialization information
    save_node_init: false
    # Whether to rewrite the initialization information, if false then load the already existing initialization information. 
    # Only works if save_node_init is true.
    rewrite_node_init: false
    # Only works if save_node_init is true.
    node_init_path: data/ogbn-products/node_init
    # Whether to use precomputed node state, used only when NETWORK is SGC
    # Use only when testing the whole graph
    precompute_node_state: false
    node_state_path: data/ogbn-products/node_state
    # Whether to enable batch array access.
    batch_array_access: true
    # Same as MAX_DEGREE in the dataset properties
    # The bigger this is, the more secure it is, but the more memory it takes up when running.
    base_array_size: 2
    # Number of nodes processed in one funcBatchArrayAccessVector call
    batch_node_size_array_access: 64

